name: Build RootEncoder Debug APK
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Configure gradle mirror
        run: |
          mkdir -p ~/.gradle
          echo "allprojects { repositories { maven { url 'https://maven.aliyun.com/repository/google' } maven { url 'https://maven.aliyun.com/repository/public' } } }" > ~/.gradle/init.gradle

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-build-cache --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RootEncoder-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
